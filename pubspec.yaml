name: driver_app
description: Production-ready Flutter driver app starter for a food delivery platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0
  flutter_secure_storage: ^9.2.4
  audioplayers: ^6.4.0
  fl_chart: ^0.71.0
  timezone: ^0.10.0
  logger: ^2.5.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0A7C86"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#081217"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#081217"
    image: assets/branding/splash_logo.png
